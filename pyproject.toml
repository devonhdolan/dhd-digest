[project]
name = "dhd-digest"
version = "0.1.0"
description = "Automated link curator for the Devon H. Dolan Link Digest"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40",
  "voyageai>=0.3",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "httpx>=0.27",
  "feedparser>=6.0",
  "selectolax>=0.3",
  "python-dotenv>=1.0",
  "tenacity>=9.0",
  "pydantic>=2.9",
]

[project.scripts]
dhd = "dhd_digest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dhd_digest"]
