name: daily-ingest
on:
  schedule:
    # 06:17 Pacific daylight time (05:17 in winter, PST). GitHub starts
    # scheduled jobs hours late, so in practice this lands mid-morning, after
    # the newsletters. Off the hour to dodge the top-of-hour queue. On Sundays
    # a late start can overlap weekly.yml; the shared concurrency group below
    # makes the two queue instead of racing on the database.
    - cron: "17 13 * * *"
  workflow_dispatch:

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: read
  issues: write        # opens the daily review issue

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      IMAP_HOST: ${{ secrets.IMAP_HOST }}
      IMAP_USER: ${{ secrets.IMAP_USER }}
      IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
      IMAP_FOLDER: ${{ secrets.IMAP_FOLDER }}
      IMAP_PICKS_FOLDER: ${{ secrets.IMAP_PICKS_FOLDER }}   # blank = INBOX
      OWNER_EMAILS: ${{ secrets.OWNER_EMAILS }}             # your addresses, comma-separated
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run dhd init-db     # idempotent; applies additive schema changes
      - run: uv run dhd ingest
      - run: uv run dhd triage 800
      - run: uv run dhd review-open
      - run: uv run dhd stats
