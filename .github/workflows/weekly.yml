name: weekly-draft
on:
  schedule:
    # Sunday 08:17 Pacific daylight time (07:17 in winter, PST). GitHub cron is
    # UTC-only and starts scheduled jobs late under load (3-5h has been
    # typical); off-the-hour minutes dodge the worst of the top-of-hour queue.
    - cron: "17 15 * * 0"
  workflow_dispatch:

concurrency:
  group: pipeline        # shared with daily.yml, which fires at the same time
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      IMAP_HOST: ${{ secrets.IMAP_HOST }}
      IMAP_USER: ${{ secrets.IMAP_USER }}
      IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
      IMAP_FOLDER: ${{ secrets.IMAP_FOLDER }}
      IMAP_PICKS_FOLDER: ${{ secrets.IMAP_PICKS_FOLDER }}
      OWNER_EMAILS: ${{ secrets.OWNER_EMAILS }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run dhd init-db
      # Catch anything since the last daily run - above all, links forwarded
      # in since, which must make this draft.
      - run: uv run dhd ingest
      - run: uv run dhd triage 800
      - run: uv run dhd assemble
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: draft/issue-${{ github.run_number }}
          title: "Draft issue"
          commit-message: "weekly draft"
          body: |
            Automated draft. Review pass:
            - cut the dull ones
            - add asides (~8)
            - fill Listen / Read / Watch
            Merging does not publish. After sending, run `dhd publish <issue-number>`
            (the number is in the drafts/issue-N.md filename above).
          add-paths: drafts/
